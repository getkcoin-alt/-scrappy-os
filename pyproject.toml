[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrappy-os"
version = "0.1.0"
description = "Scrappy OS - an AI-native control plane for Linux servers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Scrappy OS contributors" }]
keywords = ["ai", "agent", "operations", "linux", "control-plane"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]

dependencies = [
  "aiosqlite>=0.20",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psutil>=6.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "structlog>=24.4",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "types-psutil",
  "types-pyyaml",
]

[project.scripts]
scrappy = "scrappy_os.interface.cli:main"

[project.urls]
Homepage = "https://github.com/getkcoin-alt/-scrappy-os"
Source = "https://github.com/getkcoin-alt/-scrappy-os"

[tool.hatch.build.targets.wheel]
packages = ["src/scrappy_os"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # bugbear
  "S",   # bandit
  "A",   # builtins shadowing
  "C4",  # comprehensions
  "BLE", # blind except - must be justified with a noqa and a reason
  "RUF", # ruff-specific
]
ignore = [
  "S101", # assert is fine in tests and internal invariants
  "B008", # FastAPI/Typer rely on calls in defaults
  "N818", # errors are named for what happened (ToolNotFound), not suffixed -Error
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]
"src/scrappy_os/tools/shell.py" = ["S603"]  # subprocess use is the point; guarded by policy

[tool.ruff.lint.isort]
known-first-party = ["scrappy_os"]

[tool.mypy]
python_version = "3.12"
files = ["src/scrappy_os"]
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["psutil.*", "aiosqlite.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "security: tests that assert a safety boundary holds",
  "integration: tests that exercise more than one component",
]
filterwarnings = ["error::DeprecationWarning:scrappy_os.*"]
